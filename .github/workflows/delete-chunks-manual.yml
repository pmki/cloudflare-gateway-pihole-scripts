name: Manual - Delete Filter Lists

# Kích hoạt tính năng cho phép bấm chạy thủ công trên giao diện GitHub Actions
on:
  workflow_dispatch:

jobs:
  delete-lists:
    runs-on: ubuntu-latest
    steps:
      # 1. Clone source code từ repo về môi trường chạy
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js để chạy script .js của bạn
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Chạy script xóa các chunk lists
      - name: Run Delete Filter Lists Script
        run: node cf_list_delete_chunks.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
